name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (pure Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit + simulation tests
        run: ./gradlew -PcoreOnly :core:test --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: core-test-reports
          path: core/build/reports/tests

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug APK + app unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Check APK permissions (camera only, no INTERNET)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          echo "--- declared by (manifest merger):"
          grep -A1 "^uses-permission#" app/build/outputs/logs/manifest-merger-debug-report.txt || true
          grep -q "android.permission.CAMERA" permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET"; exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pallet-counter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  python:
    name: Python tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: pip install -r training_tools/requirements.txt pytest
      - name: pytest
        run: python -m pytest

  android-emulator:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          # Separate runs so a crash in the UI flow cannot hide the other results. The UI flow
          # (camera, rotation, threads) runs three times to catch intermittent failures. Logcat
          # is kept for crash diagnosis (only this emulator's synthetic test session).
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.notClass=com.palletcounter.app.AppFlowInstrumentedTest || echo engine >> app/build/android-tests-failed
            mkdir -p app/build/test-xml/part1 && cp -r app/build/outputs/androidTest-results/. app/build/test-xml/part1/
            for i in 1 2 3; do ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.palletcounter.app.AppFlowInstrumentedTest || echo "ui run $i" >> app/build/android-tests-failed; mkdir -p app/build/test-xml/ui$i && cp -r app/build/outputs/androidTest-results/. app/build/test-xml/ui$i/; done
            adb logcat -d -v threadtime > app/build/logcat.txt
            test ! -f app/build/android-tests-failed
      - name: Print instrumented test results
        if: always()
        run: |
          find app/build/test-xml -name "*.xml" -print -exec cat {} + || true
          if [ -f app/build/logcat.txt ]; then
            echo "--- crashes (logcat)"
            grep -n -A45 "FATAL EXCEPTION" app/build/logcat.txt | head -150 || true
            echo "--- app log (logcat)"
            grep -E " (ScanEngine|TfliteYoloDetector|CameraBinder|AndroidRuntime|TestRunner): " app/build/logcat.txt | tail -60 || true
          fi
      - name: Instrumented test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports
          path: app/build/reports/androidTests
